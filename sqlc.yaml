version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "db/schema/payment.sql"
    queries:
      - "db/queries/payment.sql"
    gen:
      go:
        package: "paymentdb"
        out: "internal/payment/repository/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: false
